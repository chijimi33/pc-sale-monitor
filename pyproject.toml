[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-sale-monitor"
version = "0.1.0"
description = "Evidence-based Japanese PC sale collection and reporting"
requires-python = ">=3.12"
dependencies = ["lxml==6.1.3", "Pillow==12.3.0", "pypdf==6.18.1", "playwright==1.62.0"]

[project.scripts]
sale-monitor = "sale_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["sale_monitor*"]
