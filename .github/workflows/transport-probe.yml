name: Targeted transport comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/transport_probe.py', '.github/workflows/transport-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare urllib and system curl without updating monitor state
        run: python -B -X utf8 tools/transport_probe.py
