name: Tests
on:
  pull_request:
  push:
    branches: [main, 'redesign/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Run the tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Name the failing tests (readable without signing in)
        if: failure()
        run: python scripts/ci_test_failures.py "$RUNNER_TEMP/tests.log"
