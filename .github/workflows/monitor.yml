name: Sale monitor (parallel validation)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths: ['sale_monitor/**', 'config/**', 'scripts/**', '!scripts/qa/**', 'pyproject.toml', '.github/workflows/monitor.yml']

permissions:
  contents: read

# One writer at a time. A queued run waits for the previous one, so the state
# branch is never updated by two runs, including across a code change.
concurrency:
  group: sale-monitor-state
  cancel-in-progress: false

# Stages and their limits are described in docs/architecture.md, section 3.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v

  run:
    needs: test
    runs-on: ubuntu-latest
    # run.max_minutes in config/routes.json bounds the pipeline itself; the
    # remainder covers setup and the unconditional state save.
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      # Optional tools. A package mirror outage must not stop collection:
      # without the browser, pages that need rendering fail as ordinary
      # errors, and without OCR the flyer is reported as not collected.
      - name: Install the browser (optional, time-limited)
        continue-on-error: true
        timeout-minutes: 8
        run: python -m playwright install chromium && (timeout 240 sudo "$(which python)" -m playwright install-deps chromium || echo "browser system packages not installed")
      - name: Install OCR tools (optional, time-limited)
        continue-on-error: true
        timeout-minutes: 6
        run: timeout 120 sudo apt-get update; timeout 200 sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn poppler-utils
      - run: python scripts/state_branch.py prepare
      - name: Archive legacy queues (idempotent, keeps history and events unchanged)
        run: python -m sale_monitor.cli migrate --state state-repo/state --input-sha "$(git -C state-repo rev-parse HEAD)"
      - name: Save the migration before any collection
        run: python scripts/state_branch.py publish --state-only
      - name: Verify run events for validation
        run: python scripts/capture_run_provenance.py --state state-repo/state --run-id "$RUN_ID"
      - name: Discover, plan, verify and publish in one run
        run: python -m sale_monitor.cli run --state state-repo/state --public state-repo/public --run-id "$RUN_ID"
      - name: Save collected state even when the run failed
        if: always()
        run: if [ -d state-repo/.git ]; then python scripts/state_branch.py publish; else echo "state was never fetched; nothing to save"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-result-json
          path: state-repo/public/
          retention-days: 14
          if-no-files-found: warn
